<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6bff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="月账本">
  <meta name="description" content="记录每月的收入、预算、预支和零星开销，自动算出结余。">
  <title>月账本 · 预算与结余</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <header class="topbar">
    <button id="prevMonth" class="icon-btn" type="button" aria-label="上个月">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="monthLabel" class="month-label" type="button">2026年1月</button>
    <button id="nextMonth" class="icon-btn" type="button" aria-label="下个月">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="spacer"></span>
    <button id="todayBtn" class="ghost-btn hidden" type="button">回到本月</button>
    <button id="openSettings" class="icon-btn" type="button" aria-label="设置">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.9"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <div id="storageBanner" class="banner hidden"></div>
  <div id="backupBanner" class="banner hidden">
    <span id="backupBannerText"></span>
    <button id="backupNow" class="mini-btn" type="button">立即备份</button>
  </div>

  <main>
    <section id="hero" class="hero">
      <div class="hero-top">
        <div id="heroLabel" class="hero-label">本月结余</div>
        <div id="heroEdit" class="hero-edit">改收入 ✎</div>
      </div>
      <div id="heroValue" class="hero-value">¥0.00</div>
      <div id="heroSub" class="hero-sub"></div>
    </section>

    <section id="statTiles" class="tiles"></section>

    <section class="card">
      <div class="progress-head">
        <span>预算执行进度</span>
        <span id="progressPercent">暂无预算</span>
      </div>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill" style="width:0%"></div>
      </div>
      <div id="progressFoot" class="progress-foot"></div>
    </section>

    <nav class="tabs">
      <button id="tab-budget" class="tab active" type="button">预算<span class="tab-count"></span></button>
      <button id="tab-ledger" class="tab" type="button">记账<span class="tab-count"></span></button>
      <button id="tab-advance" class="tab" type="button">预支<span class="tab-count"></span></button>
    </nav>

    <section id="listArea"></section>
  </main>

  <button id="fab" class="fab" type="button">＋ 预算项目</button>

  <div id="backdrop" class="backdrop hidden"></div>
  <section id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></section>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="src/core.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
