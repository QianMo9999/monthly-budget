<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef1f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="月账本">
  <meta name="description" content="记录每月的收入、预算、预支和零星开销，自动算出结余。">
  <title>月账本 · 预算与结余</title>
  <script>
    (function () {
      var theme = 'light';
      try {
        if (window.localStorage.getItem('monthly-budget-theme') === 'dark') theme = 'dark';
      } catch (error) {}
      document.documentElement.dataset.theme = theme;
      if (theme === 'dark') {
        document.querySelector('meta[name="theme-color"]').content = '#111315';
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = 'black-translucent';
      }
    }());
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="src/vendor/bottom-sheet/styles.css">
  <link rel="stylesheet" href="src/styles-v2.css">
</head>
<body>
  <a class="skip-link" href="#mainContent">跳到主要内容</a>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="month-switch" aria-label="月份切换">
        <button id="monthLabel" class="month-label" type="button">2026年1月</button>
        <button id="prevMonth" class="icon-btn" type="button" aria-label="上个月">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button id="nextMonth" class="icon-btn" type="button" aria-label="下个月">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
      <div class="top-actions">
        <button id="todayBtn" class="ghost-btn hidden" type="button" aria-label="回到本月">本月</button>
        <button id="themeToggle" class="icon-btn theme-toggle" type="button" aria-label="切换为深色模式" aria-pressed="false" title="切换为深色模式">
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg>
        </button>
        <button id="openSettings" class="icon-btn" type="button" aria-label="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.05.05-2.83 2.83-.05-.05a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.57V21h-4v-.07a1.7 1.7 0 0 0-1.04-1.57 1.7 1.7 0 0 0-1.87.34l-.05.05-2.83-2.83.05-.05A1.7 1.7 0 0 0 4.6 15.04 1.7 1.7 0 0 0 3.07 14H3v-4h.07A1.7 1.7 0 0 0 4.6 8.96a1.7 1.7 0 0 0-.34-1.87l-.05-.05 2.83-2.83.05.05a1.7 1.7 0 0 0 1.87.34A1.7 1.7 0 0 0 10 3.07V3h4v.07a1.7 1.7 0 0 0 1.04 1.53 1.7 1.7 0 0 0 1.87-.34l.05-.05 2.83 2.83-.05.05a1.7 1.7 0 0 0-.34 1.87A1.7 1.7 0 0 0 20.93 10H21v4h-.07a1.7 1.7 0 0 0-1.53 1Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div id="storageBanner" class="banner hidden"></div>
  <div id="backupBanner" class="banner hidden">
    <span id="backupBannerText"></span>
    <button id="backupNow" class="mini-btn" type="button">立即备份</button>
  </div>

  <main id="mainContent">
    <section id="hero" class="hero" role="button" tabindex="0" aria-label="修改收入与结转">
      <div class="hero-top">
        <div id="heroLabel" class="hero-label">本月结余</div>
      </div>
      <div id="heroValue" class="hero-value">¥0.00</div>
      <div id="heroSub" class="hero-sub"></div>
    </section>

    <section id="statTiles" class="tiles hidden" aria-hidden="true"></section>

    <div class="summary-grid">
      <section class="card progress-card">
        <div class="progress-head">
          <span>预算执行进度</span>
          <span id="progressPercent">暂无预算</span>
        </div>
        <div class="progress-track">
          <div id="progressFill" class="progress-fill" style="width:0%"></div>
        </div>
        <div id="progressFoot" class="progress-foot"></div>
      </section>

      <section id="breakdownCard" class="card breakdown"></section>
    </div>

    <nav class="tabs" role="tablist" aria-label="账目类型">
      <span id="tabIndicator" class="tab-indicator" aria-hidden="true"></span>
      <button id="tab-budget" class="tab active" type="button" role="tab" aria-selected="true"><span class="tab-label">预算</span><span class="tab-count"></span></button>
      <button id="tab-ledger" class="tab" type="button" role="tab" aria-selected="false"><span class="tab-label">记账</span><span class="tab-count"></span></button>
      <button id="tab-advance" class="tab" type="button" role="tab" aria-selected="false"><span class="tab-label">预支</span><span class="tab-count"></span></button>
    </nav>

    <section id="listArea"></section>
  </main>

  <button id="fab" class="fab" type="button" data-glass-tone="light"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>预算项目</span></button>

  <div id="sheetRoot" class="bs-root">
    <div id="backdrop" class="backdrop bs-backdrop hidden"></div>
    <section id="sheet" class="sheet bs-sheet hidden" data-mode="bottom" role="dialog" aria-modal="true" aria-label="操作面板" tabindex="-1"></section>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="src/core.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
