name: 发布到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true 会自动打开仓库的 Pages（不用手动去 Settings 设置）
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 只发布网页本身需要的文件，测试和脚本不进站点
      - name: 准备站点文件
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest _site/
          cp -r src icons _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
